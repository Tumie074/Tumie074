<svg xmlns="http://www.w3.org/2000/svg" width="855" height="195" viewBox="0 0 855 195" role="img" aria-label="Contributions and streaks">
<style>
.num{font:800 30px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#E4DCFF} .cnum{font:800 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#5EF2FF}
.lbl{font:600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#B08CFF} .clbl{font:700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#5EF2FF} .sub{font:500 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#9D92C9}
.p{opacity:0;animation:fade .6s ease-out forwards} @keyframes fade{to{opacity:1}}
.arc{stroke-dasharray:251.3;stroke-dashoffset:251.3;animation:fill 1.2s ease-out .4s forwards} @keyframes fill{to{stroke-dashoffset:0}}
</style>
<rect x=".5" y=".5" width="854" height="194" rx="10" fill="#100A2A" stroke="#3A1A6E"/>
<line x1="285" y1="28" x2="285" y2="167" stroke="#3A1A6E" stroke-width="1.5"/>
<line x1="570" y1="28" x2="570" y2="167" stroke="#3A1A6E" stroke-width="1.5"/>
<g class="p" style="animation-delay:.1s"><text x="142.5" y="84" text-anchor="middle" class="num">181</text><text x="142.5" y="122" text-anchor="middle" class="lbl">Total Contributions</text><text x="142.5" y="150" text-anchor="middle" class="sub">10 Jul 2024 – present</text></g>
<g class="p" style="animation-delay:.3s">
<circle cx="427.5" cy="72" r="40" fill="none" stroke="#3A1A6E" stroke-width="6"/>
<circle class="arc" cx="427.5" cy="72" r="40" fill="none" stroke="#7A48E2" stroke-width="6" stroke-linecap="round" transform="rotate(-90 427.5 72)"/>
<path d="M427.5 18 c5 5 7 9 4 13 c-2 3-8 3-9-1 c-1-3 1-5 2-7 c0 2 1 3 2 3 c1-3 0-5 1-8z" fill="#FF78BE"/>
<text x="427.5" y="82" text-anchor="middle" class="cnum">1</text>
<text x="427.5" y="142" text-anchor="middle" class="clbl">Current Streak</text>
<text x="427.5" y="168" text-anchor="middle" class="sub">27 Nov 2026 – today</text>
</g>
<g class="p" style="animation-delay:.5s"><text x="712.5" y="84" text-anchor="middle" class="num">5</text><text x="712.5" y="122" text-anchor="middle" class="lbl">Longest Streak</text><text x="712.5" y="150" text-anchor="middle" class="sub">28 Aug 2024 – 1 Sep 2024</text></g>
</svg>