name: Update profile cards

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours (01:17, 07:17, 13:17, 19:17 SAST)
  workflow_dispatch:        # run it by hand from the Actions tab
  push:
    branches: [main]        # any change to this repo redraws the cards

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw stats, language and streak cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: assets
        run: python3 .github/scripts/make_cards.py

      - name: Draw contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#5EF2FF&color_dots=#221846,#3A1A6E,#7A48E2,#B08CFF,#FF78BE

      - name: Commit if anything changed
        run: |
          cp dist/snake.svg assets/snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "Update profile cards"
          git pull --rebase
          git push
