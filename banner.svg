<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Itumeleng Ntela — Software Engineer · Cloud · AI · Data">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3A1A6E"/>
      <stop offset="1" stop-color="#100A2A"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#B08CFF"/>
      <stop offset=".55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#5EF2FF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#7A48E2"/>
      <stop offset="1" stop-color="#5EF2FF"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#8C78FF" fill-opacity=".25"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="45"/></filter>
    <style>
      .t{stroke:#5EF2FF;stroke-width:2.5;fill:none;stroke-opacity:.55;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 3.5s ease-out forwards}
      .t2{animation-delay:.6s}.t3{animation-delay:1.2s}
      .n{fill:#5EF2FF;animation:pulse 2.4s ease-in-out infinite}
      .p{fill:#FF78BE;animation:pulse 2.4s ease-in-out infinite;animation-delay:1.2s}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>

  <!-- circuit traces left -->
  <path class="t" d="M0 70 H70 V120 H140"/>
  <path class="t t2" d="M0 210 H90 V170 H160"/>
  <path class="t t3" d="M40 300 V250 H120"/>
  <circle class="n" cx="140" cy="120" r="6" filter="url(#glow)"/>
  <circle class="p" cx="160" cy="170" r="6" filter="url(#glow)"/>
  <circle class="n" cx="120" cy="250" r="5" filter="url(#glow)"/>
  <!-- circuit traces right -->
  <path class="t" d="M1200 60 H1120 V110 H1050"/>
  <path class="t t2" d="M1200 200 H1100 V240 H1030"/>
  <path class="t t3" d="M1160 0 V40 H1080"/>
  <circle class="p" cx="1050" cy="110" r="6" filter="url(#glow)"/>
  <circle class="n" cx="1030" cy="240" r="6" filter="url(#glow)"/>
  <circle class="n" cx="1080" cy="40" r="5" filter="url(#glow)"/>

  <!-- glow orb -->
  <ellipse cx="600" cy="140" rx="330" ry="110" fill="#7A48E2" opacity=".35" filter="url(#soft)"/>

  <text x="600" y="92" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="18" letter-spacing="4" fill="#5EF2FF">&lt;hello world /&gt;</text>
  <text x="600" y="162" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" fill="url(#title)">Itumeleng Ntela</text>
  <rect x="510" y="184" width="180" height="5" rx="2.5" fill="url(#bar)"/>
  <text x="600" y="226" text-anchor="middle" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" fill="#E4DCFF">Aspiring Software Engineer  ·  Cloud  ·  AI  ·  Data</text>
  <text x="600" y="260" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" fill="#B08CFF">BSc Hons CS &amp; IT @ North-West University · Potchefstroom, ZA<tspan class="cur" fill="#5EF2FF"> ▌</tspan></text>
</svg>
